<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Padel - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root { --brand: #0ea5e9; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem;
        }
        .brand { font-size: 2rem; font-weight: 900; color: var(--brand); letter-spacing: 2px; }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: var(--brand);
            color: #f1f5f9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }
        .form-label { color: #94a3b8; font-size: 0.9rem; }
        .btn-brand {
            background: var(--brand);
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-brand:hover { background: #0284c7; color: white; }
        .alert-danger { background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <div class="brand">Z PADEL</div>
                        <p class="text-secondary mt-1">لوحة الإدارة</p>
                    </div>
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-danger">{{ messages[0] }}</div>
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">اسم المستخدم</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-brand w-100">دخول</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
