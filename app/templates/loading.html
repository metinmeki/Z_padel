<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Z Padel</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{
      background:#596770;
      font-family:'Barlow Condensed',sans-serif;
      display:flex;align-items:center;justify-content:center;
      cursor:none;
    }
    .bg-glow{
      position:fixed;inset:0;
      background:radial-gradient(ellipse 65% 65% at 50% 44%, rgba(214,195,161,0.09) 0%, transparent 68%);
      pointer-events:none;
    }
    .court-bg{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      pointer-events:none;
      opacity:0;
      animation:fadeIn 1s 0.3s ease forwards;
    }
    .court-bg svg{
      width:min(88vw,720px);
      height:auto;
      opacity:.07;
    }
    .cl{stroke-dasharray:2000;stroke-dashoffset:2000;}
    .cl1{animation:draw 1.3s 0.5s ease forwards;}
    .cl2{animation:draw 0.9s 0.8s ease forwards;}
    .cl3{animation:draw 0.8s 1.0s ease forwards;}
    .cl4{animation:draw 1.0s 1.1s ease forwards;}
    .cl5{animation:draw 1.0s 1.2s ease forwards;}
    .cl6{animation:draw 1.2s 1.3s ease forwards;}
    .cl7{animation:draw 0.8s 1.4s ease forwards;}
    .cl8{animation:draw 0.8s 1.5s ease forwards;}
    .corner{
      position:fixed;
      width:30px;height:30px;
      opacity:0;
      animation:fadeIn 0.7s 1.1s ease forwards;
    }
    .corner.tl{top:28px;left:28px;border-top:1px solid rgba(214,195,161,0.4);border-left:1px solid rgba(214,195,161,0.4);}
    .corner.tr{top:28px;right:28px;border-top:1px solid rgba(214,195,161,0.4);border-right:1px solid rgba(214,195,161,0.4);}
    .corner.bl{bottom:28px;left:28px;border-bottom:1px solid rgba(214,195,161,0.4);border-left:1px solid rgba(214,195,161,0.4);}
    .corner.br{bottom:28px;right:28px;border-bottom:1px solid rgba(214,195,161,0.4);border-right:1px solid rgba(214,195,161,0.4);}
    .center{
      position:relative;z-index:10;
      display:flex;flex-direction:column;
      align-items:center;gap:0;
      text-align:center;
    }
    .logo-mark{
      width:clamp(90px,14vw,120px);
      height:clamp(90px,14vw,120px);
      margin-bottom:20px;
      opacity:0;
      border-radius:50%;
      animation:riseUp 0.9s 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
      object-fit:contain;
    }
    .logo-text{
      display:flex;align-items:baseline;gap:10px;
      margin-bottom:14px;
      opacity:0;
      animation:riseUp 0.9s 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .logo-z{
      font-size:clamp(64px,12vw,96px);
      font-weight:800;
      color:#D6C3A1;
      line-height:1;
      letter-spacing:-3px;
    }
    .logo-name{
      font-size:clamp(26px,5vw,42px);
      font-weight:700;
      color:#F5F0E8;
      letter-spacing:12px;
      line-height:1;
      padding-bottom:8px;
    }
    .divider{
      width:60px;height:1px;
      background:linear-gradient(90deg,transparent,#D6C3A1,transparent);
      margin-bottom:12px;
      opacity:0;
      animation:fadeIn 0.6s 1.0s ease forwards;
    }
    .tagline{
      font-family:'Barlow',sans-serif;
      font-size:clamp(10px,1.8vw,13px);
      font-weight:300;
      letter-spacing:5px;
      text-transform:uppercase;
      color:rgba(214,195,161,0.65);
      margin-bottom:48px;
      opacity:0;
      animation:fadeIn 0.7s 1.05s ease forwards;
    }
    .progress-wrap{
      width:min(260px,55vw);
      height:1px;
      background:rgba(214,195,161,0.18);
      position:relative;
      margin-bottom:14px;
      opacity:0;
      animation:fadeIn 0.5s 1.2s ease forwards;
    }
    .progress-bar{
      position:absolute;
      top:0;left:0;bottom:0;
      width:0%;
      background:linear-gradient(90deg,rgba(89,103,112,0.5),#D6C3A1,#EDE0C8);
      transition:width 0.15s linear;
    }
    .progress-bar::after{
      content:'';
      position:absolute;right:-4px;top:-3px;
      width:7px;height:7px;
      border-radius:50%;
      background:#D6C3A1;
      box-shadow:0 0 12px rgba(214,195,161,0.85);
    }
    .status{
      font-size:10px;
      font-weight:500;
      letter-spacing:2.5px;
      text-transform:uppercase;
      color:rgba(214,195,161,0.5);
      opacity:0;
      animation:fadeIn 0.5s 1.2s ease forwards;
      transition:opacity 0.25s;
      height:16px;
    }
    body.exit{
      animation:exitAnim 0.85s cubic-bezier(0.76,0,0.24,1) forwards;
    }
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes riseUp{
      from{opacity:0;transform:translateY(24px);}
      to  {opacity:1;transform:translateY(0);}
    }
    @keyframes draw{to{stroke-dashoffset:0;}}
    @keyframes exitAnim{
      0%  {opacity:1;transform:scale(1);}
      35% {opacity:1;transform:scale(1.025);}
      100%{opacity:0;transform:scale(1.06);}
    }
    @media(max-width:480px){
      .corner{width:18px;height:18px;}
      .corner.tl{top:18px;left:18px;}
      .corner.tr{top:18px;right:18px;}
      .corner.bl{bottom:18px;left:18px;}
      .corner.br{bottom:18px;right:18px;}
    }
  </style>
</head>

      <div class="progress-bar" id="bar"></div>

  <script>
    const bar    = document.getElementById('bar');
    const status = document.getElementById('status');

    const steps = [
      { pct: 18,  msg: 'Preparing your courts...',  delay: 1300 },
      { pct: 42,  msg: 'Loading availability...',   delay: 500  },
      { pct: 67,  msg: 'Almost ready...',            delay: 480  },
      { pct: 88,  msg: 'Finalizing...',              delay: 420  },
      { pct: 100, msg: 'Welcome to Z Padel',         delay: 380  },
    ];

    let t = 0;
    steps.forEach(s => {
      t += s.delay;
      setTimeout(() => {
        bar.style.width    = s.pct + '%';
        status.textContent = s.msg;
      }, t);
    });

    const totalTime = t + 600;
    setTimeout(() => {
      document.body.classList.add('exit');
      setTimeout(() => {
        window.location.href = "{{ url_for('main.index') }}";
      }, 800);
    }, totalTime);
  </script>
