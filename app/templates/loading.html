<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Z Padel</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{
      background:#080808;
      font-family:'Barlow Condensed',sans-serif;
      display:flex;align-items:center;justify-content:center;
      cursor:none;
    }

    /* BG GLOW */
    .bg-glow{
      position:fixed;inset:0;
      background:radial-gradient(ellipse 65% 65% at 50% 44%, rgba(201,168,76,0.07) 0%, transparent 68%);
      pointer-events:none;
    }

    /* COURT SVG BACKGROUND */
    .court-bg{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      pointer-events:none;
      opacity:0;
      animation:fadeIn 1s 0.3s ease forwards;
    }
    .court-bg svg{
      width:min(88vw,720px);
      height:auto;
      opacity:.07;
    }
    .cl{stroke-dasharray:2000;stroke-dashoffset:2000;}
    .cl1{animation:draw 1.3s 0.5s ease forwards;}
    .cl2{animation:draw 0.9s 0.8s ease forwards;}
    .cl3{animation:draw 0.8s 1.0s ease forwards;}
    .cl4{animation:draw 1.0s 1.1s ease forwards;}
    .cl5{animation:draw 1.0s 1.2s ease forwards;}
    .cl6{animation:draw 1.2s 1.3s ease forwards;}
    .cl7{animation:draw 0.8s 1.4s ease forwards;}
    .cl8{animation:draw 0.8s 1.5s ease forwards;}

    /* CORNER BRACKETS */
    .corner{
      position:fixed;
      width:30px;height:30px;
      opacity:0;
      animation:fadeIn 0.7s 1.1s ease forwards;
    }
    .corner.tl{top:28px;left:28px;border-top:1px solid rgba(201,168,76,0.38);border-left:1px solid rgba(201,168,76,0.38);}
    .corner.tr{top:28px;right:28px;border-top:1px solid rgba(201,168,76,0.38);border-right:1px solid rgba(201,168,76,0.38);}
    .corner.bl{bottom:28px;left:28px;border-bottom:1px solid rgba(201,168,76,0.38);border-left:1px solid rgba(201,168,76,0.38);}
    .corner.br{bottom:28px;right:28px;border-bottom:1px solid rgba(201,168,76,0.38);border-right:1px solid rgba(201,168,76,0.38);}

    /* CENTER CONTENT */
    .center{
      position:relative;z-index:10;
      display:flex;flex-direction:column;
      align-items:center;gap:0;
      text-align:center;
    }

    /* LOGO */
    .logo{
      display:flex;align-items:baseline;gap:12px;
      margin-bottom:16px;
      opacity:0;
      animation:riseUp 0.9s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .logo-z{
      font-size:clamp(80px,15vw,120px);
      font-weight:800;
      color:#C9A84C;
      line-height:1;
      letter-spacing:-3px;
    }
    .logo-name{
      font-size:clamp(30px,5.5vw,48px);
      font-weight:700;
      color:#F5F2EC;
      letter-spacing:12px;
      line-height:1;
      padding-bottom:10px;
    }

    /* DIVIDER */
    .divider{
      width:60px;height:1px;
      background:linear-gradient(90deg,transparent,#C9A84C,transparent);
      margin-bottom:14px;
      opacity:0;
      animation:fadeIn 0.6s 1.0s ease forwards;
    }

    /* TAGLINE */
    .tagline{
      font-family:'Barlow',sans-serif;
      font-size:clamp(11px,2vw,14px);
      font-weight:300;
      letter-spacing:5px;
      text-transform:uppercase;
      color:rgba(201,168,76,0.6);
      margin-bottom:52px;
      opacity:0;
      animation:fadeIn 0.7s 1.05s ease forwards;
    }

    /* PROGRESS */
    .progress-wrap{
      width:min(260px,55vw);
      height:1px;
      background:rgba(201,168,76,0.15);
      position:relative;
      margin-bottom:14px;
      opacity:0;
      animation:fadeIn 0.5s 1.2s ease forwards;
    }
    .progress-bar{
      position:absolute;
      top:0;left:0;bottom:0;
      width:0%;
      background:linear-gradient(90deg,#6B500F,#C9A84C,#E8CC7A);
      transition:width 0.15s linear;
    }
    .progress-bar::after{
      content:'';
      position:absolute;right:-4px;top:-3px;
      width:7px;height:7px;
      border-radius:50%;
      background:#C9A84C;
      box-shadow:0 0 12px rgba(201,168,76,0.9);
    }

    /* STATUS */
    .status{
      font-size:10px;
      font-weight:500;
      letter-spacing:2.5px;
      text-transform:uppercase;
      color:rgba(138,130,120,0.65);
      opacity:0;
      animation:fadeIn 0.5s 1.2s ease forwards;
      transition:opacity 0.25s;
      height:16px;
    }

    /* EXIT */
    body.exit{
      animation:exitAnim 0.85s cubic-bezier(0.76,0,0.24,1) forwards;
    }

    /* KEYFRAMES */
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes riseUp{
      from{opacity:0;transform:translateY(24px);}
      to  {opacity:1;transform:translateY(0);}
    }
    @keyframes draw{to{stroke-dashoffset:0;}}
    @keyframes exitAnim{
      0%  {opacity:1;transform:scale(1);}
      35% {opacity:1;transform:scale(1.025);}
      100%{opacity:0;transform:scale(1.06);}
    }

    @media(max-width:480px){
      .corner{width:18px;height:18px;}
      .corner.tl{top:18px;left:18px;}
      .corner.tr{top:18px;right:18px;}
      .corner.bl{bottom:18px;left:18px;}
      .corner.br{bottom:18px;right:18px;}
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Animated court lines -->
  <div class="court-bg">
    <svg viewBox="0 0 700 460" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect  class="cl cl1" x="30"  y="30"  width="640" height="400" stroke="#C9A84C" stroke-width="1.2"/>
      <line  class="cl cl2" x1="350" y1="30"  x2="350" y2="430" stroke="#C9A84C" stroke-width="1"/>
      <line  class="cl cl3" x1="30"  y1="230" x2="670" y2="230" stroke="#C9A84C" stroke-width="2"/>
      <rect  class="cl cl4" x="120" y="30"  width="460" height="200" stroke="#C9A84C" stroke-width=".9"/>
      <rect  class="cl cl5" x="120" y="230" width="460" height="200" stroke="#C9A84C" stroke-width=".9"/>
      <circle class="cl cl6" cx="350" cy="230" r="56" stroke="#C9A84C" stroke-width="1"/>
      <rect  class="cl cl7" x="30"  y="130" width="112" height="200" stroke="#C9A84C" stroke-width=".7"/>
      <rect  class="cl cl8" x="558" y="130" width="112" height="200" stroke="#C9A84C" stroke-width=".7"/>
    </svg>
  </div>

  <!-- Corner brackets -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Main content -->
  <div class="center">
    <div class="logo">
      <span class="logo-z">Z</span>
      <span class="logo-name">PADEL</span>
    </div>
    <div class="divider"></div>
    <div class="tagline">Where Champions Play</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="status" id="status">Loading...</div>
  </div>

  <script>
    const bar    = document.getElementById('bar');
    const status = document.getElementById('status');

    const steps = [
      { pct: 18,  msg: 'Preparing your courts...',  delay: 1300 },
      { pct: 42,  msg: 'Loading availability...',   delay: 500  },
      { pct: 67,  msg: 'Almost ready...',            delay: 480  },
      { pct: 88,  msg: 'Finalizing...',              delay: 420  },
      { pct: 100, msg: 'Welcome to Z Padel',         delay: 380  },
    ];

    let t = 0;
    steps.forEach(s => {
      t += s.delay;
      setTimeout(() => {
        bar.style.width    = s.pct + '%';
        status.textContent = s.msg;
      }, t);
    });

    // Redirect after animation completes
    const totalTime = t + 600; // 600ms after bar hits 100%
    setTimeout(() => {
      document.body.classList.add('exit');
      setTimeout(() => {
        // ← Change this URL to your home route
        window.location.href = "{{ url_for('main.index') }}";
      }, 800);
    }, totalTime);
  </script>

</body>
</html>
