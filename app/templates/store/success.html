<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تم الطلب بنجاح — Z Padel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0f1e;
      --surface:   #111827;
      --surface2:  #1a2332;
      --border:    #1e3a5f;
      --blue:      #0ea5e9;
      --blue-dark: #0284c7;
      --green:     #22c55e;
      --text:      #f1f5f9;
      --muted:     #64748b;
      --muted2:    #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background glow */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(14,165,233,0.08);
      animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(40px) scale(0.95); }
      to   { opacity:1; transform:translateY(0)   scale(1); }
    }

    /* Success icon */
    .success-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
      border: 2px solid rgba(34,197,94,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
    }

    @keyframes pop {
      from { transform: scale(0); opacity:0; }
      to   { transform: scale(1); opacity:1; }
    }

    .success-ring i {
      font-size: 36px;
      color: var(--green);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* Order number badge */
    .order-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(14,165,233,0.15), rgba(14,165,233,0.05));
      border: 1px solid rgba(14,165,233,0.25);
      border-radius: 50px;
      padding: 8px 22px;
      margin-bottom: 28px;
    }

    .order-badge span {
      font-size: 13px;
      color: var(--muted2);
      font-weight: 600;
    }

    .order-badge strong {
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
    }

    /* Info rows */
    .info-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .info-row:last-child { border-bottom: none; }

    .info-row .label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted2);
      font-weight: 600;
    }

    .info-row .label i {
      width: 16px;
      text-align: center;
      color: var(--blue);
      font-size: 12px;
    }

    .info-row .value {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      text-align: left;
    }

    .value.price { color: var(--blue); font-size: 15px; }
    .value.payment { color: var(--green); }

    /* Status badge */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(251,140,0,0.12);
      border: 1px solid rgba(251,140,0,0.25);
      color: #fb8c00;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0 20px;
    }

    /* Buttons */
    .btn-primary-z {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(14,165,233,0.30);
      margin-bottom: 10px;
    }

    .btn-primary-z:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(14,165,233,0.40);
      color: white;
    }

    .btn-outline-z {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      color: var(--muted2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-outline-z:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--blue);
    }

    /* Footer note */
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Confetti dots */
    .confetti {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .confetti span {
      width: 8px; height: 8px;
      border-radius: 50%;
      animation: confettiFall 1.2s ease both;
    }
    .confetti span:nth-child(1) { background:#0ea5e9; animation-delay:0.1s; }
    .confetti span:nth-child(2) { background:#22c55e; animation-delay:0.2s; }
    .confetti span:nth-child(3) { background:#f59e0b; animation-delay:0.15s; }
    .confetti span:nth-child(4) { background:#ec4899; animation-delay:0.25s; }
    .confetti span:nth-child(5) { background:#8b5cf6; animation-delay:0.05s; }

    @keyframes confettiFall {
      from { transform: translateY(-20px); opacity:0; }
      to   { transform: translateY(0);    opacity:1; }
    }

    @media (max-width: 480px) {
      .card { padding: 28px 18px; border-radius: 18px; }
      .title { font-size: 19px; }
      .success-ring { width: 76px; height: 76px; }
      .success-ring i { font-size: 30px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="confetti">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="success-ring">
    <i class="fas fa-check"></i>
  </div>

  <div class="title">تم استلام طلبك!</div>
  <div class="subtitle">سنتواصل معك قريباً لتأكيد الطلب</div>

  <div class="order-badge">
    <span>رقم الطلب</span>
    <strong>#{{ order.id }}</strong>
  </div>

  <div class="info-card">
    <div class="info-row">
      <div class="label"><i class="fas fa-user"></i> الاسم</div>
      <div class="value">{{ order.customer_name }}</div>
    </div>
    <div class="info-row">
      <div class="label"><i class="fas fa-phone"></i> الهاتف</div>
      <div class="value" style="direction:ltr;">{{ order.customer_phone }}</div>
    </div>
    <div class="info-row">
      <div class="label"><i class="fas fa-coins"></i> الإجمالي</div>
      <div class="value price">{{ "{:,.0f}".format(order.total_price) }} <small style="font-size:11px;font-weight:400;opacity:.7;">د.ع</small></div>
    </div>
    <div class="info-row">
      <div class="label"><i class="fas fa-money-bill-wave"></i> الدفع</div>
      <div class="value payment"><i class="fas fa-circle" style="font-size:7px;margin-left:4px;"></i>كاش عند الاستلام</div>
    </div>
    <div class="info-row">
      <div class="label"><i class="fas fa-circle-half-stroke"></i> الحالة</div>
      <div class="value">
        <span class="status-pill"><i class="fas fa-hourglass-half" style="font-size:9px;"></i>قيد المعالجة</span>
      </div>
    </div>
  </div>

  <a href="{{ url_for('store.shop') }}" class="btn-primary-z">
    <i class="fas fa-shopping-bag"></i> متابعة التسوق
  </a>
  <a href="{{ url_for('main.index') }}" class="btn-outline-z">
    <i class="fas fa-house"></i> العودة للرئيسية
  </a>

  <div class="footer-note">
    <i class="fas fa-shield-halved"></i>
    طلبك آمن ومحمي — Z Padel دهوك
  </div>
</div>

</body>
</html>
