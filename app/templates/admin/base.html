<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Z Padel Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --brand-blue: #1565C0; --off-white: #F5F8FF; --sidebar-width: 260px;
      --transition: all 0.3s ease;
    }
    html, body { height: 100%; font-family: 'Cairo', sans-serif; background: var(--off-white); overflow-x: hidden; }

    /* منع تعارض المودال مع العناصر المتحركة */
    .main-wrapper { margin-right: var(--sidebar-width); min-height: 100vh; transition: var(--transition); }

    /* تحسين الأداء */
    .topbar { position: sticky; top: 0; z-index: 900; background: rgba(255,255,255,0.95); border-bottom: 1px solid #D6E4F7; padding: 15px 24px; display: flex; align-items: center; justify-content: space-between; will-change: transform; }
    .page-content { padding: 24px; }

    @media (max-width: 992px) { .main-wrapper { margin-right: 0; } }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">...</aside>

<div class="main-wrapper" id="mainWrapper">
  <header class="topbar">
     </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
</div>

{% block modals %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // تحسين أداء المودال ومنع تعليق الصفحة
  document.addEventListener('DOMContentLoaded', () => {
    const modals = document.querySelectorAll('.modal');
    modals.forEach(modal => {
        modal.addEventListener('shown.bs.modal', () => {
            document.body.style.overflow = 'hidden';
        });
        modal.addEventListener('hidden.bs.modal', () => {
            document.body.style.overflow = 'auto';
        });
    });
  });
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
