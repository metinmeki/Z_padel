{% extends 'admin/base.html' %}
{% block title %}إضافة حجز{% endblock %}
{% block page_title %}إضافة حجز جديد{% endblock %}

{% block extra_css %}
<style>
  .form-wrap { max-width: 680px; }
  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 1.8rem; }
  .f-label { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; display: block; }
  .f-ctrl {
    display: block; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px;
    font-size: .85rem; padding: 8px 12px;
    font-family: 'Cairo', sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  .f-ctrl:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,165,233,.12); background: var(--surface); color: var(--text); }
  .f-ctrl::placeholder { color: var(--muted); }
  .f-ctrl option { background: var(--card); }
  .price-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .price-box .p-lbl { font-size: .75rem; color: var(--muted); font-weight: 600; }
  .price-box .p-num { font-size: 1.6rem; font-weight: 900; color: var(--brand); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: .82rem; font-weight: 600; margin-bottom: 1.2rem; transition: color .15s; }
  .back-link:hover { color: var(--brand); }
  .section-sep { border: none; border-top: 1px solid var(--border); margin: 1.2rem 0; }
</style>
{% endblock %}

{% block content %}

<a href="{{ url_for('admin.bookings') }}" class="back-link">
  <i class="fas fa-arrow-right"></i> العودة للحجوزات
</a>

<div class="form-wrap">
  <div class="form-card">
    <form method="POST">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="f-label">اسم العميل *</label>
          <input type="text" name="customer_name" class="f-ctrl" required placeholder="الاسم الكامل">
        </div>
        <div class="col-md-6">
          <label class="f-label">رقم الهاتف *</label>
          <input type="text" name="customer_phone" class="f-ctrl" required placeholder="07xx-xxx-xxxx">
        </div>

        <div class="col-12">
          <label class="f-label">الملعب *</label>
          <select name="court_id" class="f-ctrl" required id="courtSel">
            <option value="">اختر الملعب</option>
            {% for court in courts %}
            <option value="{{ court.id }}" data-price="{{ court.price_per_hour }}">
              {{ court.name }} — {{ "{:,.0f}".format(court.price_per_hour) }} د.ع/ساعة
            </option>
            {% endfor %}
          </select>
        </div>

        <hr class="section-sep col-12">

        <div class="col-md-4">
          <label class="f-label">التاريخ *</label>
          <input type="date" name="date" class="f-ctrl" required id="dateInp">
        </div>
        <div class="col-md-4">
          <label class="f-label">وقت البداية *</label>
          <input type="time" name="start_time" class="f-ctrl" required id="startInp">
        </div>
        <div class="col-md-4">
          <label class="f-label">وقت النهاية *</label>
          <input type="time" name="end_time" class="f-ctrl" required id="endInp">
        </div>

        <div class="col-12">
          <div class="price-box">
            <div class="p-lbl"><i class="fas fa-coins me-1"></i>المبلغ الإجمالي</div>
            <div class="p-num" id="totalPrice">0 د.ع</div>
          </div>
        </div>

        <div class="col-12">
          <label class="f-label">ملاحظات</label>
          <textarea name="notes" class="f-ctrl" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
        </div>

      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn-z"><i class="fas fa-save"></i> حفظ الحجز</button>
        <a href="{{ url_for('admin.bookings') }}" class="btn-z-ghost">إلغاء</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
  function calcPrice() {
    const sel   = document.getElementById('courtSel');
    const start = document.getElementById('startInp').value;
    const end   = document.getElementById('endInp').value;
    const price = sel.options[sel.selectedIndex]?.dataset.price || 0;
    const el    = document.getElementById('totalPrice');
    if (start && end && price) {
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const hours = ((eh * 60 + em) - (sh * 60 + sm)) / 60;
      if (hours > 0) {
        el.textContent = Math.round(hours * price).toLocaleString() + ' د.ع';
        return;
      }
    }
    el.textContent = '0 د.ع';
  }
  document.getElementById('courtSel').addEventListener('change', calcPrice);
  document.getElementById('startInp').addEventListener('change', calcPrice);
  document.getElementById('endInp').addEventListener('change', calcPrice);

  // Default to today
  document.getElementById('dateInp').valueAsDate = new Date();
</script>
{% endblock %}
