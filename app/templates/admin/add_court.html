<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Z Padel - إضافة ملعب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root { --brand: #0ea5e9; }
        body { background: #0f172a; color: #f1f5f9; }
        .sidebar { width: 240px; min-height: 100vh; background: #1e293b; border-left: 1px solid #334155; position: fixed; right: 0; top: 0; padding: 1.5rem 0; }
        .sidebar .brand { font-size: 1.5rem; font-weight: 900; color: var(--brand); text-align: center; padding: 0 1rem 1.5rem; border-bottom: 1px solid #334155; }
        .sidebar a { display: block; padding: 0.75rem 1.5rem; color: #94a3b8; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { color: var(--brand); background: rgba(14,165,233,0.1); }
        .main-content { margin-right: 240px; padding: 2rem; }
        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; max-width: 600px; }
        .form-label { color: #94a3b8; font-size: 0.9rem; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; border-radius: 8px; }
        .form-control:focus { background: #0f172a; border-color: var(--brand); color: #f1f5f9; box-shadow: none; }
        .btn-brand { background: var(--brand); color: white; border: none; border-radius: 8px; padding: 0.75rem 2rem; font-weight: 700; }
        .btn-brand:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">Z PADEL</div>
        <div style="margin-top: 1.5rem;">
            <a href="/admin/">📊 الرئيسية</a>
            <a href="/admin/courts" class="active">🏟 الملاعب</a>
            <a href="/admin/bookings">📅 الحجوزات</a>
        </div>
    </div>
    <div class="main-content">
        <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;">إضافة ملعب جديد</h1>
        <div class="form-card">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">اسم الملعب *</label>
                    <input type="text" name="name" class="form-control" required placeholder="مثال: ملعب A">
                </div>
                <div class="mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="وصف الملعب..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">السعر بالساعة (د.ع) *</label>
                    <input type="number" name="price_per_hour" class="form-control" required placeholder="25000">
                </div>
                <div class="mb-4">
                    <label class="form-label">صورة الملعب</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn-brand">حفظ الملعب</button>
                    <a href="/admin/courts" class="btn btn-outline-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
