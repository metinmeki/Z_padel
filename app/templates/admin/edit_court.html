{% extends 'admin/base.html' %}
{% block title %}تعديل ملعب{% endblock %}
{% block page_title %}تعديل الملعب{% endblock %}

{% block extra_css %}
<style>
  .form-wrap { max-width: 620px; }
  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 1.8rem; }
  .f-label { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; display: block; }
  .f-ctrl {
    display: block; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px;
    font-size: .85rem; padding: 8px 12px;
    font-family: 'Cairo', sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  .f-ctrl:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,165,233,.12); background: var(--surface); color: var(--text); }
  .f-ctrl::placeholder { color: var(--muted); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: .82rem; font-weight: 600; margin-bottom: 1.2rem; transition: color .15s; }
  .back-link:hover { color: var(--brand); }
  .img-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 9px; margin-bottom: 10px; border: 1px solid var(--border); }
  .check-wrap { display: flex; align-items: center; gap: 8px; }
  .check-wrap input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
</style>
{% endblock %}

{% block content %}

<a href="{{ url_for('admin.courts') }}" class="back-link">
  <i class="fas fa-arrow-right"></i> العودة للملاعب
</a>

<div class="form-wrap">
  <div class="form-card">
    <form method="POST" enctype="multipart/form-data">

      <div class="mb-3">
        <label class="f-label">اسم الملعب *</label>
        <input type="text" name="name" class="f-ctrl" required value="{{ court.name }}">
      </div>

      <div class="mb-3">
        <label class="f-label">الوصف</label>
        <textarea name="description" class="f-ctrl" rows="3">{{ court.description or '' }}</textarea>
      </div>

      <div class="mb-3">
        <label class="f-label">السعر بالساعة (د.ع) *</label>
        <input type="number" name="price_per_hour" class="f-ctrl" required value="{{ court.price_per_hour | int }}">
      </div>

      <div class="mb-3">
        <label class="f-label">صورة الملعب</label>
        {% if court.image %}
          <img src="/static/images/{{ court.image }}" class="img-preview" alt="صورة الملعب">
        {% endif %}
        <input type="file" name="image" class="f-ctrl" accept="image/*" style="padding:6px 12px;">
        <div style="font-size:.72rem; color:var(--muted); margin-top:4px;">اتركه فارغاً للإبقاء على الصورة الحالية</div>
      </div>

      <div class="mb-4">
        <label class="f-label">الحالة</label>
        <div class="check-wrap">
          <input type="checkbox" name="is_active" id="isActive" {% if court.is_active %}checked{% endif %}>
          <label for="isActive" style="font-size:.85rem; cursor:pointer;">الملعب نشط (متاح للحجز)</label>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn-z"><i class="fas fa-save"></i> حفظ التعديلات</button>
        <a href="{{ url_for('admin.courts') }}" class="btn-z-ghost">إلغاء</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
